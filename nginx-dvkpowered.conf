# Nginx reverse proxy config for v1smart.dvkpowered.org and v2smart.dvkpowered.org
# Place in /etc/nginx/sites-available/learnwell-burnout.conf
# and symlink to /etc/nginx/sites-enabled/learnwell-burnout.conf

server {
    listen 80;
    server_name v1smart.dvkpowered.org;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name v2smart.dvkpowered.org;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
